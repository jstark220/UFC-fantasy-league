<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - UFC Fantasy League</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <div class="card">
    <h1>Log In</h1>
    <p class="subtitle">Welcome back</p>

    <!-- Error message; hidden by default, shown by login.js -->
    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Log In</button>

    </form>

    <div class="form-footer">
      <!-- TODO (post-MVP): wire up via supabaseClient.auth.resetPasswordForEmail() -->
      <a href="#">Forgot password?</a>
    </div>

    <div class="form-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <!-- Load Supabase CDN first, then shared config, then this page's logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
