<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- iOS home-screen app: icon + full-screen (standalone) launch. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knockdown">
  <meta name="theme-color" content="#0E0E10">

  <!-- theme.js runs first to set data-theme on <html> before any CSS is
       painted, preventing a flash of the wrong background color -->
  <script src="js/theme.js"></script>

  <!-- Google Fonts: Bebas Neue for display, Space Grotesk for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design system: tokens first, then component patterns -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css?v=1">

  <title>Log In - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body class="auth-page">

  <!-- Wordmark above the form card -->
  <a href="index.html" class="auth-logo">
    <span class="auth-logo__mark"><span class="kf-red">Knockdown</span> Fantasy</span>
  </a>

  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account</p>

    <!-- Error message; hidden by default, shown by login.js -->
    <div id="message" class="message"></div>

    <!-- Google OAuth — redirects to Google, then back to dashboard.html
         once Supabase has exchanged the code for a session. -->
    <button type="button" class="btn-oauth" id="googleBtn">
      <svg class="btn-oauth__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M21.6 12.227c0-.709-.064-1.39-.182-2.045H12v3.868h5.382a4.6 4.6 0 0 1-1.996 3.018v2.51h3.232c1.891-1.742 2.982-4.305 2.982-7.351z"/>
        <path fill="#34A853" d="M12 22c2.7 0 4.964-.895 6.618-2.423l-3.232-2.509c-.895.6-2.04.955-3.386.955-2.605 0-4.81-1.76-5.595-4.123H3.064v2.59A9.996 9.996 0 0 0 12 22z"/>
        <path fill="#FBBC05" d="M6.405 13.9A6.006 6.006 0 0 1 6.09 12c0-.66.114-1.3.314-1.9V7.51H3.064A9.997 9.997 0 0 0 2 12c0 1.614.386 3.14 1.064 4.49l3.341-2.59z"/>
        <path fill="#EA4335" d="M12 5.977c1.468 0 2.786.504 3.823 1.495l2.868-2.868C16.96 2.987 14.695 2 12 2A9.996 9.996 0 0 0 3.064 7.51l3.341 2.59C7.191 7.737 9.395 5.977 12 5.977z"/>
      </svg>
      <span>Sign in with Google</span>
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Log in
      </button>

    </form>

    <div class="form-footer">
      <a href="forgot-password.html">Forgot password?</a>
    </div>

    <div class="form-footer">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>

  <!-- Theme toggle below the card -->
  <div class="auth-footer">
    <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
  </div>

  <!-- Supabase CDN, then shared config, then this page's logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login.js"></script>

  <!-- Set the correct icon for whichever theme is currently active -->
  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
