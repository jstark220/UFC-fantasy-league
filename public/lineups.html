<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- iOS home-screen app: icon + full-screen (standalone) launch. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knockdown">
  <meta name="theme-color" content="#0E0E10">

  <script src="js/theme.js"></script>
  <script src="js/mobile-nav.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css?v=2">
  <link rel="stylesheet" href="styles/components.css?v=42">

  <title>All Lineups - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body>

  <div class="dashboard-page" id="pageContent" style="display: none;">

    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>
      <div class="top-nav__links">
        <a href="#" class="btn-ghost" id="lineupBackLink">← My lineup</a>
      </div>
      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <button id="globalLogoutBtn" class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <div class="league-header">
      <div class="league-header__inner">
        <h1 class="league-header__name" id="leagueName">All Lineups</h1>
      </div>
    </div>

    <div class="dashboard-body">
      <!-- Event banner — name, date, status, picker. Rendered by lineups.js. -->
      <div id="eventBanner"></div>

      <!-- Per-member starter cards. Rendered by lineups.js. -->
      <div id="lineupsGrid"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/empty-state.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/chat-nav.js"></script>
  <script src="js/waiver-phase.js?v=2"></script>
  <script src="js/custom-dropdown.js"></script>
  <script src="js/page-help-modal.js"></script>
  <script src="js/league-primer.js"></script>
  <script src="js/event-overrides.js"></script>
  <!-- Fighter modal + its data deps (opened by clicking a starter cell) -->
  <script src="js/scoring.js"></script>
  <script src="js/score-breakdown.js"></script>
  <script src="js/country-flags.js"></script>
  <script src="js/next-fight.js"></script>
  <script src="js/fight-odds.js?v=2"></script>
  <script src="js/projections.js?v=2"></script>
  <script src="js/fantasy-value.js?v=1"></script>
  <script src="js/fighter-modal.js"></script>
  <script src="js/fight-rows.js?v=2"></script>
  <script src="js/fight-card-modal.js?v=5"></script>
  <script src="js/lineups.js?v=8"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
