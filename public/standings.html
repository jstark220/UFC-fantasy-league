<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings - UFC Fantasy League</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Hidden until auth check and data load complete -->
  <div class="page" id="pageContent" style="display: none;">

    <a href="#" class="back-link" id="leagueLink">&#8592; League</a>

    <div class="page-header">
      <h1 id="leagueName"></h1>
    </div>

    <!-- Main standings table -->
    <div class="section">
      <h2>Standings</h2>
      <table id="standingsTable">
        <thead>
          <tr>
            <th class="th-rank">#</th>
            <th>Team</th>
            <th class="th-pts">Total Pts</th>
            <th class="th-pts">Avg / Event</th>
            <th class="th-pts">Last Event</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>

    <!-- Per-event scoring history; populated by standings.js when event data exists -->
    <div class="section">
      <h2>Event History</h2>
      <div id="eventHistory"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/standings.js"></script>

</body>
</html>
