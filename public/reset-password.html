<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">

  <title>Set New Password - Knockdown Fantasy</title>
</head>
<body class="auth-page">

  <a href="index.html" class="auth-logo">
    <span class="auth-logo__mark"><span class="kf-red">Knockdown</span> Fantasy</span>
  </a>

  <div class="card">
    <h1>Choose a new password</h1>
    <p class="subtitle" id="subtitle">You'll be signed in afterwards.</p>

    <!-- Status banner — populated by reset-password.js -->
    <div id="message" class="message"></div>

    <!-- Form hidden until we confirm the recovery session is valid -->
    <form id="resetForm" style="display: none;">

      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your new password" minlength="8" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Set password
      </button>

    </form>

    <!-- Shown when the recovery link is missing/expired -->
    <div id="invalidLink" style="display: none;">
      <p style="color: var(--text-secondary); margin: var(--space-4) 0;">
        This reset link is invalid or has expired. Reset links work once and
        expire after about an hour for security.
      </p>
      <a href="forgot-password.html" class="btn-primary" style="display: inline-block;">
        Request a new link
      </a>
    </div>

    <div class="form-footer">
      <a href="login.html">Back to login</a>
    </div>
  </div>

  <div class="auth-footer">
    <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/reset-password.js"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
