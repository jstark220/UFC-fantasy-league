<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- iOS home-screen app: icon + full-screen (standalone) launch. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knockdown">
  <meta name="theme-color" content="#0E0E10">

  <script src="js/theme.js"></script>
  <script src="js/mobile-nav.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css?v=10">

  <title>Roster - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body>

  <div class="dashboard-page" id="pageContent" style="display: none;">

    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>
      <div class="top-nav__links">
        <a href="#" class="btn-ghost" id="leagueLink">← League</a>
      </div>
      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <button id="globalLogoutBtn" class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <div class="league-header">
      <div class="league-header__inner">
        <h1 class="league-header__name" id="leagueName"></h1>
        <div class="league-header__actions" id="headerActions"></div>
      </div>
    </div>

    <div class="dashboard-body">

      <!-- Event banner: rendered by lineup.js -->
      <div id="eventBanner"></div>

      <!-- Roster imbalance warning — shown when trades / FA leave the roster
           out of alignment with construction rules. Populated by lineup.js. -->
      <div id="rosterImbalanceBanner" class="roster-imbalance-banner" style="display: none;"></div>

      <!-- Starter card slots. On mobile this section is sticky and the
           cards inside collapse to a compact horizontal strip so all the
           starter slots stay visible while the user scrolls the roster
           beneath. -->
      <div class="lineup-section lineup-section--starters">
        <p class="section-label">
          My Starters
          <span class="section-label__count" id="starterCount">(0 / 3)</span>
        </p>
        <div class="lineup-starters" id="starterSlots"></div>
      </div>

      <!-- Full roster list -->
      <div class="lineup-section">
        <p class="section-label">My Roster</p>
        <div class="lineup-roster-list" id="rosterList"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/empty-state.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/chat-nav.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/score-breakdown.js"></script>
  <script src="js/country-flags.js"></script>
  <script src="js/next-fight.js"></script>
  <script src="js/fight-odds.js?v=2"></script>
  <script src="js/projections.js?v=2"></script>
  <script src="js/fantasy-value.js"></script>
  <script src="js/fighter-modal.js"></script>
  <script src="js/event-overrides.js"></script>
  <script src="js/fight-card-modal.js?v=3"></script>
  <script src="js/waiver-phase.js?v=1"></script>
  <script src="js/activity.js"></script>
  <script src="js/commissioner.js"></script>
  <script src="js/custom-dropdown.js"></script>
  <script src="js/page-help-modal.js"></script>
  <script src="js/league-primer.js"></script>
  <script src="js/league-nav.js"></script>
  <script src="js/draft-sounds.js"></script>
  <script src="js/lineup.js?v=5"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
