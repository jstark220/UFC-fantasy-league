<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- theme.js runs first so data-theme is set before any CSS renders -->
  <script src="js/theme.js"></script>

  <!-- Google Fonts: Bebas Neue for display, Space Grotesk for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">

  <title>Dashboard - Knockdown Fantasy</title>
</head>
<body>

  <!-- Page starts hidden. dashboard.js checks auth, then reveals it. -->
  <div class="dashboard-page" id="dashboardContent" style="display: none;">

    <!-- Sticky top nav -->
    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>

      <div class="top-nav__links"></div>

      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <!-- Pre-placed so auth-guard.js won't inject a second floating button -->
        <button id="globalLogoutBtn" class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <!-- Welcome header: crimson eyebrow + Bebas Neue username + next-event sub -->
    <div class="dashboard-header">
      <div class="dashboard-header__inner">
        <p class="dashboard-welcome__eyebrow">Welcome back</p>
        <h1 class="dashboard-welcome__name" id="welcomeName">--</h1>
        <p class="dashboard-welcome__sub" id="welcomeSub">Next card locks Saturday &middot; UFC 329</p>
      </div>
    </div>

    <!-- Page body -->
    <div class="dashboard-body">

      <!-- Quick stat strip: three at-a-glance numbers -->
      <div class="dashboard-stats">
        <div class="dashboard-stat">
          <span class="dashboard-stat__value" id="statLeagues">0</span>
          <span class="dashboard-stat__label">Active Leagues</span>
        </div>
        <div class="dashboard-stat">
          <span class="dashboard-stat__value">UFC 329</span>
          <span class="dashboard-stat__label">Next Event</span>
        </div>
        <div class="dashboard-stat">
          <span class="dashboard-stat__value">Sat May 3</span>
          <span class="dashboard-stat__label">Lineup Locks</span>
        </div>
      </div>

      <!-- Leagues section: toggled by dashboard.js based on whether leagues exist -->
      <p class="section-label">Your Leagues</p>

      <!-- Empty state: shown when the user has no leagues -->
      <div class="dashboard-empty" id="leaguesEmpty" style="display: none;">
        <p class="dashboard-empty__title">You're not in any leagues yet.</p>
        <p class="dashboard-empty__sub">Create a new league or ask a friend to invite you.</p>
        <div class="dashboard-empty__actions">
          <a href="create-league.html" class="btn-primary">Create a league</a>
          <a href="join-league.html"   class="btn-secondary">Join a league</a>
        </div>
      </div>

      <!-- League list: shown when the user has at least one league -->
      <div id="leaguesList"></div>

      <!-- Always-visible action row below the league list -->
      <div class="dashboard-league-actions">
        <a href="create-league.html" class="btn-secondary">+ Create a league</a>
        <a href="join-league.html"   class="btn-secondary">+ Join a league</a>
      </div>

    </div>

  </div>

  <!-- Supabase CDN, shared config, auth guard, then page logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/dashboard.js"></script>

  <!-- Sync theme toggle icon to current theme after page loads -->
  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
