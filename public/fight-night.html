<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- iOS home-screen app: icon + full-screen (standalone) launch. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knockdown">
  <meta name="theme-color" content="#0E0E10">

  <script src="js/theme.js"></script>
  <script src="js/mobile-nav.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css?v=39">

  <title>Fight Night - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body class="page-fight-night">

  <div class="dashboard-page" id="pageContent" style="display: none;">

    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>
      <div class="top-nav__links">
        <a href="#" class="btn-ghost" id="leagueLink">← League</a>
      </div>
      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <button id="globalLogoutBtn" class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <div class="league-header">
      <div class="league-header__inner">
        <h1 class="league-header__name" id="leagueName">Fight Night</h1>
        <div class="league-header__actions" id="headerActions"></div>
      </div>
    </div>

    <div class="dashboard-body">
      <!-- FINAL-state event winner banner -->
      <div id="hubWinner"></div>

      <!-- Event hero: name, venue, status / countdown, updated stamp -->
      <div id="hubHero"></div>

      <!-- Mobile-only: MY BAR (sticky one-glance status) + segmented tabs -->
      <div class="hub-mybar" id="hubMyBar"></div>
      <div class="hub-tabs" id="hubTabs"></div>

      <div class="hub-layout">
        <div class="hub-main">
          <div class="hub-section hub-now" id="hubNowSection"></div>
          <div class="hub-section" id="hubUpNextSection"></div>
          <div class="hub-section" id="hubFeedSection"></div>
          <div class="hub-section" id="hubCardSection"></div>
        </div>
        <aside class="hub-rail">
          <div class="hub-section" id="hubRaceSection"></div>
        </aside>
      </div>

      <!-- Desktop-only docked chat column (filled + initialized by fight-night.js;
           empty on mobile so the floating popup keeps sole ownership of the chat DOM).
           Lives inside dashboard-body so its top aligns with the event hero. -->
      <aside class="hub-chat-dock" id="hubChatDock" aria-label="League chat"></aside>
    </div>

  </div>

  <!-- toast layer -->
  <div class="hub-toasts" id="hubToasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/empty-state.js"></script>
  <script src="js/league-nav.js"></script>
  <script src="js/chat.js"></script>
  <script>window.CHAT_POPUP_DISABLED = window.matchMedia('(min-width: 1101px)').matches;</script>
  <script src="js/chat-widget.js"></script>
  <script src="js/chat-nav.js"></script>
  <script src="js/waiver-phase.js?v=2"></script>
  <script src="js/page-help-modal.js"></script>
  <script src="js/league-primer.js"></script>
  <script src="js/event-overrides.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/score-breakdown.js"></script>
  <script src="js/country-flags.js"></script>
  <script src="js/next-fight.js"></script>
  <script src="js/fight-odds.js?v=2"></script>
  <script src="js/projections.js?v=2"></script>
  <script src="js/fantasy-value.js?v=1"></script>
  <script src="js/fighter-modal.js"></script>
  <script src="js/fight-rows.js?v=2"></script>
  <script src="js/fight-night-store.js?v=1"></script>
  <script src="js/fight-night.js?v=18"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
