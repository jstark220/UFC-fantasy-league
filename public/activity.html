<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">

  <title>Activity - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body>

  <div class="dashboard-page" id="pageContent" style="display: none;">

    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>
      <div class="top-nav__links">
        <a href="#" class="btn-ghost" id="leagueLink">← League</a>
      </div>
      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <button id="globalLogoutBtn" class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <div class="league-header">
      <div class="league-header__inner">
        <h1 class="league-header__name" id="leagueName">Activity</h1>
      </div>
    </div>

    <div class="dashboard-body">
      <!-- Filter bar — kind multi-select. Clicking a chip adds/removes it
           from the filter. With nothing selected we show everything. -->
      <div class="activity-filter" id="activityFilter">
        <button class="activity-filter__chip activity-filter__chip--active" data-kind="all">All</button>
        <button class="activity-filter__chip" data-kind="drop">Drops</button>
        <button class="activity-filter__chip" data-kind="claim_won,claim_lost">Waivers</button>
        <button class="activity-filter__chip" data-kind="trade_proposed,trade_accepted,trade_rejected">Trades</button>
        <button class="activity-filter__chip" data-kind="draft_pick">Draft</button>
        <button class="activity-filter__chip" data-kind="event_scored">Scoring</button>
        <button class="activity-filter__chip" data-kind="member_joined,member_promoted,member_demoted">Managers</button>
      </div>

      <!-- Renders into here via LeagueActivity.renderFeed -->
      <div id="activityFeed"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/chat-nav.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/activity-page.js"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
