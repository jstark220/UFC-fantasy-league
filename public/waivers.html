<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/theme.js"></script>
  <script src="js/mobile-nav.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css?v=1">

  <title>Free Agency - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body>

  <div class="dashboard-page" id="pageContent" style="display: none;">

    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>
      <div class="top-nav__links">
        <a href="#" class="btn-ghost" id="leagueLink">← League</a>
      </div>
      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <button id="globalLogoutBtn" class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <div class="league-header">
      <div class="league-header__inner">
        <h1 class="league-header__name" id="leagueName"></h1>
        <div class="league-header__actions" id="headerActions"></div>
      </div>
    </div>

    <div class="dashboard-body">

      <!-- Phase status banner — shows whether claims are required vs instant adds,
           plus the time of the next cutoff. Populated by waivers.js. -->
      <div id="phaseBanner" class="phase-banner" style="display: none;"></div>

      <!-- Tab bar -->
      <div class="waiver-tabs">
        <button class="waiver-tab waiver-tab--active" data-tab="available">Available Fighters</button>
        <button class="waiver-tab" data-tab="my-claims">
          My Claims
          <span class="waiver-tab__count" id="claimCount" style="display:none"></span>
        </button>
        <button class="waiver-tab" data-tab="activity">Roster Activity</button>
      </div>

      <!-- Available fighters tab -->
      <div id="availableSection">
        <div class="waiver-controls">
          <input  type="text"   id="fighterSearch"   class="waiver-search" placeholder="Search fighters...">
          <select id="sortBy" class="waiver-filter">
            <option value="fantasy_value">Sort: Fantasy Value</option>
            <option value="avg_pts">Sort: Avg Points</option>
            <option value="total_pts">Sort: Total Points</option>
            <option value="recent_pts">Sort: Points (Last Year)</option>
            <option value="rank">Sort: Rank</option>
          </select>
          <select id="divisionFilter" class="waiver-filter">
            <option value="all">All Divisions</option>
            <option value="strawweight">Women's Strawweight</option>
            <option value="flyweight_w">Women's Flyweight</option>
            <option value="bantamweight_w">Women's Bantamweight</option>
            <option value="flyweight">Men's Flyweight</option>
            <option value="bantamweight">Men's Bantamweight</option>
            <option value="featherweight">Men's Featherweight</option>
            <option value="lightweight">Men's Lightweight</option>
            <option value="welterweight">Men's Welterweight</option>
            <option value="middleweight">Men's Middleweight</option>
            <option value="light_heavyweight">Men's Light Heavyweight</option>
            <option value="heavyweight">Men's Heavyweight</option>
          </select>
          <select id="statusFilter" class="waiver-filter">
            <option value="all">All Fighters</option>
            <option value="undefeated">Undefeated</option>
            <option value="top5">Top 5</option>
            <option value="top10">Top 10</option>
            <option value="unranked">Unranked</option>
          </select>
          <!-- Populated by waivers.js from upcoming events the user can pick to
               narrow available fighters down to people booked on a card -->
          <select id="eventFilter" class="waiver-filter">
            <option value="all">All Events</option>
          </select>
          <label class="waiver-toggle">
            <input type="checkbox" id="showAllToggle">
            Show rostered
          </label>
        </div>
        <div id="availableContent"></div>
      </div>

      <!-- My claims tab -->
      <div id="myClaimsSection" style="display: none;">
        <div id="myClaimsContent"></div>
      </div>

      <!-- Roster activity tab — league-wide approved claims -->
      <div id="activitySection" style="display: none;">
        <div id="activityContent"></div>
      </div>

      <!-- Commissioner queue — always below tabs, hidden until needed -->
      <div id="commissionerSection" style="display: none;"></div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/empty-state.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/chat-nav.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/score-breakdown.js"></script>
  <script src="js/country-flags.js"></script>
  <script src="js/next-fight.js"></script>
  <script src="js/fight-odds.js"></script>
  <script src="js/projections.js"></script>
  <script src="js/fantasy-value.js"></script>
  <script src="js/fighter-modal.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/commissioner.js"></script>
  <script src="js/waiver-phase.js"></script>
  <script src="js/custom-dropdown.js"></script>
  <script src="js/page-help-modal.js"></script>
  <script src="js/league-primer.js"></script>
  <script src="js/league-nav.js"></script>
  <script src="js/event-overrides.js"></script>
  <script src="js/waivers.js"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
