<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">

  <title>Draft Room - Knockdown Fantasy</title>
</head>
<body>

  <div class="draft-page" id="pageContent" style="display: none;">

    <!-- Slim top nav, same as the rest of the app -->
    <nav class="top-nav">
      <a href="index.html" class="top-nav__logo">
        <span class="kf-red">Knockdown</span> Fantasy
      </a>
      <div class="top-nav__links">
        <a href="#" class="btn-ghost" id="leagueLink">← League</a>
      </div>
      <div class="top-nav__actions">
        <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
        <button class="btn-ghost" onclick="logOut()">Log out</button>
      </div>
    </nav>

    <!-- Personal turn banner. Tall and loud when it's your pick;
         smaller "up in N picks" indicator otherwise. Hidden during
         pre-draft, completion, and pause (the status strip handles
         those states). -->
    <div class="draft-banner" id="draftBanner" hidden>
      <span class="draft-banner__text" id="draftBannerText"></span>
    </div>

    <!-- Whose-turn strip + pick counter + countdown timer. Stays compact
         so the panels get room. The timer is anchored server-side via the
         most recent pick's created_at; draft.js handles the countdown. -->
    <div class="draft-status">
      <div class="draft-status__inner">
        <p class="draft-status__turn" id="turnInfo">Loading draft...</p>
        <div class="draft-status__right">
          <div class="draft-timer" id="draftTimer" hidden>
            <span class="draft-timer__label">Pick clock</span>
            <span class="draft-timer__value" id="draftTimerValue">--</span>
          </div>
          <p class="draft-status__counter" id="pickCounter"></p>
        </div>
      </div>
    </div>

    <!-- Commissioner-only escape hatches: pause/resume the clock, undo the
         most recent pick, or wipe the board. Hidden by default; revealed
         by draft.js when the viewer is the commissioner or co-commish. -->
    <div class="draft-commish-tools" id="draftCommishTools" hidden>
      <span class="draft-commish-tools__label">Commish</span>
      <button class="btn-ghost draft-commish-btn" id="commishPauseBtn">Pause Draft</button>
      <button class="btn-ghost draft-commish-btn" id="commishUndoBtn">Undo Last Pick</button>
      <button class="btn-ghost draft-commish-btn draft-commish-btn--danger" id="commishClearBtn">Clear Board</button>
    </div>

    <!-- Mobile/narrow tab bar — switches which panel is visible.
         On wide screens, the layout is stacked (board top, panels bottom)
         and this bar hides. -->
    <div class="waiver-tabs draft-tabs" id="draftTabs">
      <button class="waiver-tab waiver-tab--active" data-panel="panel-board">Board</button>
      <button class="waiver-tab" data-panel="panel-fighters">Fighters</button>
      <button class="waiver-tab" data-panel="panel-roster">My Roster</button>
    </div>

    <!-- Stacked draft room: board on top (full width), fighters + queue/roster
         side-by-side beneath. Each section scrolls independently. -->
    <div class="draft-room draft-room--stacked">

      <!-- TOP: snake draft board (full width) -->
      <div class="draft-panel panel-board waiver-tab--active">
        <div class="draft-panel__header">
          <p class="section-label">Draft Board</p>
        </div>
        <div class="draft-panel__body" id="draftBoard"></div>
      </div>

      <!-- Resize handle: board ↕ bottom row. Lets the commish (or anyone)
           drag the divider up/down to make the board taller or shorter
           and give the panel section more or less room. -->
      <div class="draft-resize-handle draft-resize-handle--horizontal" id="resizeBoard" aria-hidden="true"></div>

      <!-- BOTTOM: fighter pool + queue/roster, with a resize handle between -->
      <div class="draft-bottom">

        <!-- LEFT: available fighter pool -->
        <div class="draft-panel panel-fighters">
          <div class="draft-panel__header draft-panel__header--with-action">
            <p class="section-label">Available Fighters</p>
            <button class="btn-ghost draft-view-all-btn" id="viewAllBtn">View All →</button>
          </div>
          <div class="draft-panel__controls">
            <input type="text" id="fighterSearch" class="waiver-search" placeholder="Search fighters...">
            <select id="sortBy" class="waiver-filter">
              <option value="rank">Sort: Rank</option>
              <option value="record">Sort: Record</option>
              <option value="points_year">Sort: Points (Year)</option>
              <option value="points_proj">Sort: Projected Pts</option>
            </select>
            <select id="divisionFilter" class="waiver-filter">
              <option value="all">All Divisions</option>
            </select>
            <select id="statusFilter" class="waiver-filter">
              <option value="all">All Fighters</option>
              <option value="undefeated">Undefeated</option>
              <option value="top5">Top 5</option>
              <option value="top10">Top 10</option>
              <option value="unranked">Unranked</option>
            </select>
          </div>
          <div class="draft-panel__body" id="fighterPool"></div>
        </div>

        <!-- Resize handle: fighters ↔ roster -->
        <div class="draft-resize-handle" id="resizeMid" aria-hidden="true"></div>

        <!-- RIGHT: queue + your roster. Both live in the same panel because
             they're both "you" — what you've drafted and what you intend to
             draft next. The queue body sits at the top so it gets attention
             during the draft; the roster grows beneath it. -->
        <div class="draft-panel panel-roster">

          <div class="draft-panel__header draft-panel__header--with-action">
            <p class="section-label">
              My Queue
              <span class="section-label__count">(<span id="queueCount">0</span>)</span>
            </p>
            <span class="draft-panel__hint" id="queueHint">Empty</span>
          </div>
          <div class="draft-panel__body draft-panel__body--queue" id="queueList"></div>

          <div class="draft-panel__header">
            <p class="section-label">
              My Roster
              <span class="section-label__count">(<span id="myPickCount">0</span> / 20)</span>
            </p>
          </div>
          <div class="draft-panel__body" id="myRoster"></div>

        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/chat-nav.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/score-breakdown.js"></script>
  <script src="js/fighter-modal.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/draft.js"></script>

  <script>
    // Sync the theme button glyph after theme.js has run
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });

    // ---- Reset inline drag-resized panel sizes whenever the window
    //      resizes. The drag handlers below set inline `flex: 0 0 Npx`
    //      and explicit `width`/`height` on .panel-board / .panel-roster
    //      to commit a user's manual size. Those pixel values don't
    //      adapt to a new window size — so when the window changes,
    //      the board can end up too short (only round 1 visible) or
    //      too tall (squishing the bottom panels). Clearing the inline
    //      styles falls back to the CSS rules (50% / 360px), which are
    //      relative and behave correctly after any resize. Users can
    //      re-drag to customize again. ----
    // Live layout sync: explicitly compute .draft-room height as
    // (viewport - everything-above-it) and set it directly. This sidesteps
    // a Safari/WebKit bug where `flex: 1 1 0` on the room inside a flex
    // column parent can resolve to 0 after window resize and stay stuck
    // there until something forces a reflow. Computing the height in JS
    // is bulletproof: the room always gets exactly the right height for
    // the current viewport, on every resize event, with no caching games.
    function _syncDraftRoomHeight() {
      var page = document.getElementById('pageContent');
      if (!page) return;
      var room = page.querySelector('.draft-room');
      if (!room) return;
      // Sum heights of every page child that ISN'T the room itself —
      // top-nav, banner, status strip, commish toolbar, mobile tab bar.
      // Hidden elements (display:none) contribute 0 naturally.
      var above = 0;
      Array.prototype.forEach.call(page.children, function(child) {
        if (child === room) return;
        above += child.getBoundingClientRect().height;
      });
      room.style.height = Math.max(0, window.innerHeight - above) + 'px';
    }
    function _onWindowResize() {
      // Clear any inline pixel sizes from the drag-handle resizers so
      // they fall back to the CSS percent/fixed defaults at the new size.
      document.querySelectorAll('.panel-board, .panel-roster').forEach(function(panel) {
        panel.style.flex       = '';
        panel.style.height     = '';
        panel.style.width      = '';
        panel.style.flexShrink = '';
      });
      _syncDraftRoomHeight();
    }
    // Listen via BOTH resize event and ResizeObserver. The resize event
    // is reliable for "did the user release the drag" but Safari/WebKit
    // throttles it during continuous drag — leaving the layout stale
    // while the user drags. ResizeObserver fires on every layout-frame
    // size change of the observed element, so it gives us live updates
    // throughout the drag.
    window.addEventListener('resize', _onWindowResize);
    if (typeof ResizeObserver !== 'undefined') {
      var _ro = new ResizeObserver(function() { _onWindowResize(); });
      _ro.observe(document.documentElement);
    }
    // Expose the sync helper so the rest of draft.js can call it whenever
    // an element above the room changes visibility (banner state flips
    // between mine/waiting/ondeck, commish toolbar reveals on init, etc.)
    window.syncDraftRoomHeight = _syncDraftRoomHeight;
    // Sync once on load so the room has the right height before the user
    // touches anything — useful if the page was loaded into a viewport
    // that's smaller than what the CSS calc would have assumed.
    _syncDraftRoomHeight();

    // ---- Drag-to-resize handles. Two flavors:
    //      * vertical handle (between Fighters and Roster) → resizes
    //        roster width left/right
    //      * horizontal handle (between Board and bottom row) → resizes
    //        board height up/down
    //      Only active on wide screens (>= 900px); on narrow screens the
    //      panels stack via tabs and both handles are hidden. ----
    document.querySelectorAll('.draft-resize-handle').forEach(function(handle) {
      handle.addEventListener('mousedown', function(e) {
        if (window.innerWidth <= 899) return;

        var isHorizontal = handle.classList.contains('draft-resize-handle--horizontal');
        var panel = document.querySelector(isHorizontal ? '.panel-board' : '.panel-roster');
        var startCoord = isHorizontal ? e.clientY : e.clientX;
        var startSize  = isHorizontal
          ? panel.getBoundingClientRect().height
          : panel.getBoundingClientRect().width;
        // The room's total inner height bounds the board's max size on the
        // vertical drag (we leave at least 160px for the bottom row so the
        // fighter pool stays usable).
        var room = document.querySelector('.draft-room');
        var roomSize = room.getBoundingClientRect().height;

        handle.classList.add('draft-resize-handle--active');
        document.body.style.cursor     = isHorizontal ? 'row-resize' : 'col-resize';
        document.body.style.userSelect = 'none';

        function onMove(ev) {
          if (isHorizontal) {
            var delta     = ev.clientY - startCoord;
            var newHeight = Math.max(160, Math.min(roomSize - 200, startSize + delta));
            panel.style.flex   = '0 0 ' + newHeight + 'px';
            panel.style.height = newHeight + 'px';
          } else {
            var deltaX   = startCoord - ev.clientX;
            var newWidth = Math.max(240, Math.min(560, startSize + deltaX));
            panel.style.width      = newWidth + 'px';
            panel.style.flexShrink = '0';
          }
        }
        function onUp() {
          handle.classList.remove('draft-resize-handle--active');
          document.body.style.cursor     = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        e.preventDefault();
      });
    });

    // ---- Tab switching for narrow screens ----
    document.getElementById('draftTabs').addEventListener('click', function(e) {
      var btn = e.target.closest('.waiver-tab');
      if (!btn) return;

      var panelKey = btn.getAttribute('data-panel');

      document.querySelectorAll('#draftTabs .waiver-tab').forEach(function(b) {
        b.classList.toggle('waiver-tab--active', b === btn);
      });

      document.querySelectorAll('.draft-panel').forEach(function(p) {
        p.classList.toggle('waiver-tab--active', p.classList.contains(panelKey));
      });
    });
  </script>

</body>
</html>
