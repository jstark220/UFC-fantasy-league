<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- theme.js runs first to set data-theme on <html> before any CSS is
       painted, preventing a flash of the wrong background color -->
  <script src="js/theme.js"></script>

  <!-- Google Fonts: Archivo Black for headers, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design system: tokens first, then component patterns -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">

  <title>Sign Up - Knockdown Fantasy</title>
</head>
<body class="auth-page">

  <!-- Wordmark above the form card -->
  <a href="index.html" class="auth-logo">
    <span class="auth-logo__mark"><span class="kf-red">Knockdown</span> Fantasy</span>
  </a>

  <div class="card">
    <h1>Create account</h1>
    <p class="subtitle">Build your roster. Win your league.</p>

    <!-- Error or success message; hidden by default, shown by signup.js -->
    <div id="message" class="message"></div>

    <form id="signupForm">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" style="width:100%; margin-top: 8px;">
        Create account
      </button>

    </form>

    <div class="form-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <!-- Theme toggle button at the bottom of the auth card area -->
  <div style="margin-top: 24px;">
    <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
  </div>

  <!-- Supabase CDN, then shared config, then this page's logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/signup.js"></script>

  <!-- Set the correct icon for whichever theme is currently active -->
  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
