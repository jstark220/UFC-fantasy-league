<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- iOS home-screen app: icon + full-screen (standalone) launch. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Knockdown">
  <meta name="theme-color" content="#0E0E10">

  <script src="js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css?v=2">
  <link rel="stylesheet" href="styles/components.css?v=42">

  <title>Forgot Password - Knockdown Fantasy</title>
  <script src="js/loading-screen.js"></script>
</head>
<body class="auth-page">

  <a href="index.html" class="auth-logo">
    <span class="auth-logo__mark"><span class="kf-red">Knockdown</span> Fantasy</span>
  </a>

  <div class="card">
    <h1>Reset password</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>

    <!-- Status banner — populated by forgot-password.js -->
    <div id="message" class="message"></div>

    <form id="forgotForm">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Send reset link
      </button>

    </form>

    <div class="form-footer">
      Remembered it? <a href="login.html">Log in</a>
    </div>
  </div>

  <div class="auth-footer">
    <button class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/forgot-password.js"></script>

  <script>
    document.querySelectorAll('.btn-theme').forEach(function(btn) {
      var theme = document.documentElement.getAttribute('data-theme');
      btn.textContent = theme === 'light' ? '☀' : '☾';
    });
  </script>

</body>
</html>
