<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosters - UFC Fantasy League</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Hidden until auth check and data load complete -->
  <div class="page" id="pageContent" style="display: none;">

    <a href="#" class="back-link" id="leagueLink">&#8592; League</a>

    <div class="page-header">
      <h1 id="leagueName"></h1>
    </div>

    <!-- Manager picker -->
    <div class="section">
      <div class="roster-picker">
        <label for="managerSelect">Viewing:</label>
        <select id="managerSelect"></select>
      </div>
      <!-- Pick count summary injected by roster.js -->
      <div id="rosterSummary" class="roster-summary"></div>
    </div>

    <!-- Fighter sections grouped by slot category, injected by roster.js -->
    <div id="rosterContent"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/roster.js"></script>

</body>
</html>
