<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Event - UFC Fantasy League</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Hidden until auth check and commissioner verification complete -->
  <div class="page" id="pageContent" style="display: none;">

    <a href="#" class="back-link" id="leagueLink">&#8592; League</a>

    <div class="page-header">
      <h1 id="leagueName"></h1>
    </div>

    <!-- Event selector: pick which event you're entering results for -->
    <div class="section">
      <h2>Score Event</h2>
      <div id="eventSelectorContent"></div>
    </div>

    <!-- Fight card: lists all fights entered so far + button to add a new one -->
    <div class="section" id="fightCardSection" style="display: none;">
      <div class="section-header-row">
        <h2 id="fightCardTitle">Fight Card</h2>
        <button class="btn-gold" id="addFightBtn">+ Add Fight</button>
      </div>
      <div id="fightCardList"></div>
    </div>

    <!-- Add/Edit fight form: shown inline when + Add Fight or Edit is clicked -->
    <div class="section" id="fightFormSection" style="display: none;">
      <h2 id="fightFormTitle">Add Fight</h2>
      <form id="fightForm">

        <!-- Fight metadata row -->
        <div class="fight-form-meta">
          <div class="form-group">
            <label for="cardPosition">Card Position</label>
            <select id="cardPosition" name="cardPosition">
              <option value="main_card">Main Card</option>
              <option value="co_main_event">Co-Main Event</option>
              <option value="main_event">Main Event</option>
              <option value="prelim">Prelim</option>
              <option value="early_prelim">Early Prelim</option>
            </select>
          </div>
          <div class="form-group">
            <label for="weightClass">Weight Class</label>
            <select id="weightClass" name="weightClass">
              <option value="strawweight">Women's Strawweight</option>
              <option value="flyweight_w">Women's Flyweight</option>
              <option value="bantamweight_w">Women's Bantamweight</option>
              <option value="flyweight">Men's Flyweight</option>
              <option value="bantamweight">Men's Bantamweight</option>
              <option value="featherweight">Men's Featherweight</option>
              <option value="lightweight">Men's Lightweight</option>
              <option value="welterweight">Men's Welterweight</option>
              <option value="middleweight">Men's Middleweight</option>
              <option value="light_heavyweight">Men's Light Heavyweight</option>
              <option value="heavyweight">Men's Heavyweight</option>
            </select>
          </div>
          <div class="form-group">
            <label for="titleType">Title Fight</label>
            <select id="titleType" name="titleType">
              <option value="none">No</option>
              <option value="divisional">Divisional Title</option>
              <option value="interim">Interim Title</option>
              <option value="bmf">BMF Belt</option>
            </select>
          </div>
          <div class="form-group fight-form-checkbox-group">
            <label>
              <input type="checkbox" id="isTitleDefense" name="isTitleDefense">
              Title Defense?
            </label>
            <label>
              <input type="checkbox" id="fightOfTheNight" name="fightOfTheNight">
              Fight of the Night
            </label>
          </div>
        </div>

        <!-- Fighter picker row: search boxes to select each fighter -->
        <div class="fight-form-fighters">
          <div class="fighter-pick-col">
            <label for="fighterASearch">Fighter A</label>
            <input type="text" id="fighterASearch" placeholder="Search fighter..." autocomplete="off">
            <div id="fighterADropdown" class="fighter-dropdown" style="display:none;"></div>
            <input type="hidden" id="fighterAId">
            <div id="fighterASelected" class="fighter-selected"></div>
          </div>
          <div class="fight-vs-divider">vs</div>
          <div class="fighter-pick-col">
            <label for="fighterBSearch">Fighter B</label>
            <input type="text" id="fighterBSearch" placeholder="Search fighter..." autocomplete="off">
            <div id="fighterBDropdown" class="fighter-dropdown" style="display:none;"></div>
            <input type="hidden" id="fighterBId">
            <div id="fighterBSelected" class="fighter-selected"></div>
          </div>
        </div>

        <!-- Outcome row: method/result, winner, round, time -->
        <div class="fight-form-outcome">
          <div class="form-group">
            <label for="outcome">Method / Result</label>
            <select id="outcome" name="outcome">
              <option value="">-- Select --</option>
              <option value="ko_tko">KO / TKO</option>
              <option value="submission">Submission</option>
              <option value="decision_u">Unanimous Decision</option>
              <option value="decision_s">Split Decision</option>
              <option value="decision_m">Majority Decision</option>
              <option value="dq">DQ</option>
              <option value="draw">Draw</option>
              <option value="no_contest">No Contest</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group">
            <label for="winner">Winner</label>
            <select id="winner" name="winner">
              <option value="">N/A</option>
              <option value="a">Fighter A</option>
              <option value="b">Fighter B</option>
            </select>
          </div>
          <div class="form-group" id="roundGroup">
            <label for="endRound">Round</label>
            <select id="endRound" name="endRound">
              <option value="">--</option>
              <option value="1">R1</option>
              <option value="2">R2</option>
              <option value="3">R3</option>
              <option value="4">R4</option>
              <option value="5">R5</option>
            </select>
          </div>
          <div class="form-group" id="timeGroup">
            <label for="endTimeSeconds">End Time (sec)</label>
            <input type="number" id="endTimeSeconds" name="endTimeSeconds" min="0" max="300" placeholder="e.g. 83">
          </div>
        </div>

        <!-- Per-fighter stat columns -->
        <div class="fight-form-stats">

          <div class="stats-col">
            <h3 id="statsHeaderA" class="stats-col-header">Fighter A Stats</h3>
            <div class="form-group">
              <label>Sig. Strikes</label>
              <input type="number" id="aSigStrikes" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Takedowns</label>
              <input type="number" id="aTakedowns" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Knockdowns</label>
              <input type="number" id="aKnockdowns" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Control (sec)</label>
              <input type="number" id="aControlSeconds" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Opponent Rank</label>
              <input type="number" id="aOpponentRank" min="1" max="15" placeholder="blank if unranked">
            </div>
            <div class="form-group">
              <label>
                <input type="checkbox" id="aPotN"> Perf. of the Night
              </label>
            </div>
          </div>

          <div class="stats-col">
            <h3 id="statsHeaderB" class="stats-col-header">Fighter B Stats</h3>
            <div class="form-group">
              <label>Sig. Strikes</label>
              <input type="number" id="bSigStrikes" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Takedowns</label>
              <input type="number" id="bTakedowns" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Knockdowns</label>
              <input type="number" id="bKnockdowns" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Control (sec)</label>
              <input type="number" id="bControlSeconds" min="0" value="0">
            </div>
            <div class="form-group">
              <label>Opponent Rank</label>
              <input type="number" id="bOpponentRank" min="1" max="15" placeholder="blank if unranked">
            </div>
            <div class="form-group">
              <label>
                <input type="checkbox" id="bPotN"> Perf. of the Night
              </label>
            </div>
          </div>

        </div>

        <div class="fight-form-actions">
          <button type="submit" class="btn-gold" id="saveFightBtn">Save Fight</button>
          <button type="button" class="btn-secondary" id="cancelFightBtn">Cancel</button>
        </div>

      </form>
    </div>

    <!-- Score preview: computed points per manager before committing to DB -->
    <div class="section" id="scorePreviewSection" style="display: none;">
      <h2>Score Preview</h2>
      <p class="score-preview-note">
        Review the computed points below, then click "Save Scores" to commit them.
        Saving will overwrite any previously saved scores for this event.
      </p>
      <div id="scorePreviewContent"></div>
      <div class="score-save-actions">
        <button class="btn-gold" id="saveScoresBtn">Save Scores to Standings</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/score-event.js"></script>

</body>
</html>
