# ============================================================================
# update-data.yml
# Runs the full data pipeline once a day and on manual trigger.
#
# Schedule: every day at 6am UTC. Daily keeps event start times, rankings, and
# results fresh - in particular enrichEventTimes.js (Step 1.5) re-checks ESPN
# each day, so a prelim start that shifts during fight week is picked up within
# 24h rather than waiting for a weekly run.
#
# Manual trigger: go to GitHub → Actions → "Update UFC Data" → Run workflow.
# Use this right after a major event if you don't want to wait for the next run.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   SUPABASE_URL              — your Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY — service role key (NOT the anon key)
# ============================================================================

name: Update UFC Data

on:
  schedule:
    - cron: '0 6 * * *'   # Every day at 6am UTC
  workflow_dispatch:        # Allow manual trigger from the GitHub Actions UI

jobs:
  update:
    name: Run data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60     # Kill the job if it runs over an hour

    steps:
      # ---- Setup ----
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ---- Step 1: Seed any new UFC events from ufcstats ----
      # Must run before ingestFightResults so new events have ufcstats_id set.
      - name: Ingest events (ufcstats)
        run: node ingestEvents.js
        continue-on-error: true   # Don't block the pipeline if ufcstats is down
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 1.5: Enrich events with real start times from ESPN ----
      # ufcstats only gives a date; ESPN publishes per-bout times. This sets
      # prelim_start_time (earliest bout, UTC) and defaults lineup_lock_time to
      # it when unset. Runs WITHOUT --relock, so manual locks are never clobbered.
      # Must run after ingestEvents so any newly-seeded events get a time too.
      - name: Enrich event start times (ESPN)
        run: node enrichEventTimes.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 2: Refresh fighter roster and records from Octagon API ----
      - name: Update fighter roster (Octagon API)
        run: node fetchFighters.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 3: Apply live rankings (scrapes ufc.com/rankings) ----
      # UFC.com is the authoritative source for rankings and champions.
      # It's updated immediately after every event by UFC staff, so this
      # picks up title changes and ranking shuffles automatically.
      - name: Apply live rankings from UFC.com
        run: node applyRankings.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 4: Activate fighters appearing on upcoming/recent cards ----
      # Catches newly signed fighters before their first fight scrape.
      - name: Activate fighters from event cards
        run: node scrapeActiveFromEvents.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 5: Ingest fight results from ESPN ----
      # Reconciles recent + upcoming ESPN-linked events into fight_results
      # (stats, method, order, matchups). Go-forward only; historical
      # ufcstats-sourced rows are left intact. Matches/dedups fighters by
      # espn_athlete_id -> name -> last-name+initial.
      - name: Ingest fight results (ESPN)
        run: node ingestFightResults.js --back=45
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 5.2: Backfill fighter W-L-D records from ESPN ----
      # fetchFighters (Octagon) misses fighters who were added by the event
      # pipeline because they fought, leaving them showing a bogus 0-0 in the UI.
      # This refreshes every ESPN-linked fighter's overall record from ESPN's
      # official data. Only writes rows whose record actually changed.
      - name: Backfill fighter records (ESPN)
        run: node backfillRecords.js --commit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 5.5: Score events into standings ----
      # Turns the fight_results just ingested into fantasy points in the `scores`
      # table (only for fighters each team STARTED). The Vercel cron already does
      # this live during a card; this daily pass is the safety net so any later
      # stat correction or manual fight edit also flows to standings within 24h.
      - name: Score events into standings
        run: node scoreEvents.js --back=45
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 5.6: Reset the weekly waiver order ----
      # After scoring, re-seed each league's waiver claim order to the INVERSE
      # of standings (worst record claims first; ties random). Self-gating: only
      # fires when a NEW event has scored since the last reset (tracked in
      # leagues.waiver_order_basis), so a daily run never wipes the mid-week
      # rolling order. Pre-season (no scores) it seeds the inverse draft order.
      # Requires once: ALTER TABLE leagues ADD COLUMN IF NOT EXISTS waiver_order_basis text;
      - name: Reset weekly waiver order
        run: node resetWaiverOrder.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 6: Clean up duplicate fighters created by ingestion ----
      # The ingest scripts can mint a separate row when a name doesn't match
      # (diacritics / reversed order). cleanupDuplicateFighters.js keeps the
      # canonical survivor and re-points ALL fighter FKs (the older
      # mergeDuplicateFighters.js missed scores/draft_picks/projections and
      # orphaned them), then deletes the dupes.
      - name: Clean up duplicate fighter records
        run: node cleanupDuplicateFighters.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 7: Re-apply UFC.com rankings ----
      # After ingestion may have created new fighter records, re-run rankings
      # so any newly-ingested fighters who are ranked on UFC.com get picked up.
      - name: Re-apply rankings after ingestion
        run: node applyRankings.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 8: Detect interim and BMF title holders ----
      # UFC.com's rankings page only lists divisional champions, not interim
      # or BMF holders. Replay our own title-fight history to figure out who
      # currently holds each. --interim-only mode leaves is_champion alone so
      # the divisional-champ data UFC.com just set isn't overwritten.
      - name: Detect interim and BMF holders
        run: node recalculateChampions.js --interim-only
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 9: Sync Polymarket fight odds ----
      # Pulls implied win probabilities from Polymarket's public Gamma API
      # for every active UFC fight market and stores them in fight_odds.
      # Frontend displays the odds on roster rows, fighter modal, and the
      # fight card. The dedicated polymarket-odds.yml workflow refreshes
      # this hourly during event weeks for tighter freshness.
      - name: Sync Polymarket odds
        run: node fetchPolymarketOdds.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Step 10: Fetch headshot photos for any new fighters ----
      - name: Fetch fighter photos
        run: node scrapePhotos.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
